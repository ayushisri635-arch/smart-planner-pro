<!DOCTYPE html>
<html>
<head>
  <title>Smart Study Planner</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: white;
      margin: 0;
      text-align: center;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #020617;
      padding: 15px 30px;
    }

    .nav-links a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    .nav-links a:hover {
      color: #38bdf8;
    }

    /* LAYOUT */
    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      margin: 15px;
      padding: 20px;
      border-radius: 12px;
      width: 280px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    input {
      padding: 8px;
      margin: 5px;
      width: 80%;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 8px 12px;
      background: #38bdf8;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: black;
      font-weight: bold;
    }

    button:hover {
      background: #0ea5e9;
    }

    li {
      margin: 8px;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <h2>📚 Smart Planner</h2>
  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">Features</a>
  </div>
</nav>

<h1>🚀 Smart Study Planner</h1>

<div class="container">

  <!-- ADD SUBJECT -->
  <div class="card">
    <h3>Add Subject</h3>
    <input id="name" placeholder="Subject">
    <input id="hours" type="number" placeholder="Hours">
    <br><br>
    <button onclick="addSubject()">Add</button>
  </div>

  <!-- SUBJECT LIST -->
  <div class="card">
    <h3>Subjects</h3>
    <ul id="list"></ul>
  </div>

  <!-- FEATURES -->
  <div class="card">
    <h3>🧩 Features</h3>
    <ul>
      <li>✅ Add subject</li>
      <li>✅ View subjects</li>
      <li>✅ Delete subject</li>
      <li>✅ Prevent duplicates</li>
      <li>✅ Data stored in MySQL</li>
      <li>✅ Backend API</li>
      <li>✅ Frontend connected</li>
    </ul>
  </div>

</div>

<script>
const API = "http://localhost:5000";

/* LOAD SUBJECTS */
async function loadSubjects() {
  let res = await fetch(API + "/subjects");
  let data = await res.json();

  let list = document.getElementById("list");
  list.innerHTML = "";

  // Show latest first
  data.reverse();

  data.forEach(s => {
    let li = document.createElement("li");

    li.innerHTML = `
      ${s.name} - ${s.hours} hrs 
      <button onclick="deleteSubject(${s.id})">❌</button>
    `;

    list.appendChild(li);
  });
}

/* ADD SUBJECT */
async function addSubject() {
  let name = document.getElementById("name").value.trim();
  let hours = document.getElementById("hours").value.trim();

  if (!name || !hours) {
    alert("Enter subject and hours");
    return;
  }

  await fetch(API + "/add-subject", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, hours })
  });

  document.getElementById("name").value = "";
  document.getElementById("hours").value = "";

  // Refresh after backend completes
  setTimeout(loadSubjects, 200);
}

/* DELETE SUBJECT */
async function deleteSubject(id) {
  await fetch(`${API}/delete/${id}`, {
    method: "DELETE"
  });

  setTimeout(loadSubjects, 200);
}

/* INITIAL LOAD */
loadSubjects();
</script>

</body>
</html>
